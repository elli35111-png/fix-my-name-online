services:
  - type: web
    name: fmnol-landing
    runtime: python
    repo: https://github.com/elli35111-png/fix-my-name-online
    branch: main
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: DOMAIN
        value: https://fixmynameonline.com
