services:
  - type: web
    name: fmnol-landing
    runtime: python
    repo: https://github.com/elli35111-png/fix-my-name-online
    branch: main
    region: oregon
    # Match the existing paid service; /var/data is its already provisioned disk.
    # Do not recreate or replace that disk during a blueprint sync.
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --access-logfile /dev/null --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: DOMAIN
        value: https://fixmynameonline.com
      - key: FMNO_DATA_DIR
        value: /var/data/fmno
